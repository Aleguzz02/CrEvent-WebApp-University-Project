<ion-header>
  <ion-toolbar mode="ios" class="toolbar-grande">
    <ion-buttons slot="start">
      <div class="contenitore-annulla annulla-uniforme">
        <ion-button class="bottone-annulla" fill="clear" (click)="signupFormRef.resetForm(); closeSignupModal()">
          Annulla
        </ion-button>
      </div>
    </ion-buttons>
    <ion-title>Registrati</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding auth-content">
  <div class="auth-modal-content">
    <app-signup-form #signupFormRef (formSubmit)="handleFormSubmit($event)"></app-signup-form>

    <ion-button class="bottone-conferma-auth" expand="block" (click)="signupFormRef.submitForm()" [strong]="true">
      Conferma
    </ion-button>

    <div class="auth-switch-section">
      <ion-text color="medium" class="auth-switch-label">
        Hai già un account?
      </ion-text>
      <ion-button class="auth-switch-button" expand="block" fill="clear" color="primary" (click)="openLoginModal()">
        Accedi
      </ion-button>
    </div>
  </div>
</ion-content>
