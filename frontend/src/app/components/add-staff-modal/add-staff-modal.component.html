<ion-header>
  <ion-toolbar>
    <ion-title>Aggiungi staff</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Chiudi</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="staffForm" (ngSubmit)="save()" class="admin-modal-form">
    
    <!-- Nome -->
    <ion-item>
      <ion-input
        formControlName="nome"
        label="Nome"
        labelPlacement="stacked"
        placeholder="Mario"
        errorText="Nome non valido (solo lettere, spazi e apostrofi)"
        maxlength="80"
        required
      ></ion-input>
    </ion-item>

    <!-- Cognome -->
    <ion-item>
      <ion-input
        formControlName="cognome"
        label="Cognome"
        labelPlacement="stacked"
        placeholder="Rossi"
        errorText="Cognome non valido (solo lettere, spazi e apostrofi)"
        maxlength="80"
        required
      ></ion-input>
    </ion-item>

    <!-- Tipo -->
    <ion-item>
      <ion-select
        formControlName="tipo"
        label="Tipo"
        labelPlacement="stacked"
        placeholder="Seleziona il tipo"
        required
      >
        <ion-select-option value="catering">Catering</ion-select-option>
        <ion-select-option value="intrattenimento">Intrattenimento</ion-select-option>
        <ion-select-option value="fotografo">Fotografo</ion-select-option>
        <ion-select-option value="altro">Altro</ion-select-option>
      </ion-select>
    </ion-item>

    <!-- Costo -->
    <ion-item>
      <ion-input
        formControlName="costo"
        label="Costo (€)"
        labelPlacement="stacked"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="0.00"
        errorText="Inserisci un costo positivo"
        required
      ></ion-input>
    </ion-item>

    <!-- Descrizione -->
    <ion-item>
      <ion-textarea
        formControlName="descrizione"
        label="Descrizione"
        labelPlacement="stacked"
        placeholder="Descrizione dettagliata dello staff"
        errorText="La descrizione è obbligatoria"
        maxlength="2000"
        required
      ></ion-textarea>
    </ion-item>

    <!-- URL Immagine -->
    <ion-item>
      <ion-input
        formControlName="urlImg"
        label="URL Immagine"
        labelPlacement="stacked"
        type="url"
        placeholder="https://esempio.com/immagine.jpg"
        errorText="Inserisci un URL valido (http:// o https://)"
        required
      ></ion-input>
    </ion-item>

    <!-- Link Sito (opzionale) -->
    <ion-item>
      <ion-input
        formControlName="linkSito"
        label="Link Sito (opzionale)"
        labelPlacement="stacked"
        type="url"
        placeholder="https://esempio.com"
        errorText="Inserisci un URL valido (http:// o https://)"
      ></ion-input>
    </ion-item>

    <!-- Genere Musicale (opzionale) -->
    <ion-item>
      <ion-input
        formControlName="genereMusicale"
        label="Genere Musicale (opzionale)"
        labelPlacement="stacked"
        placeholder="Rock, Jazz, Pop..."
        errorText="Massimo 100 caratteri"
        maxlength="100"
      ></ion-input>
    </ion-item>

    <!-- Genere Fotografico (opzionale) -->
    <ion-item>
      <ion-input
        formControlName="genereFotografico"
        label="Genere Fotografico (opzionale)"
        labelPlacement="stacked"
        placeholder="Ritratto, Paesaggio, Reportage..."
        errorText="Massimo 100 caratteri"
        maxlength="100"
      ></ion-input>
    </ion-item>

    <!-- Mansione (opzionale) -->
    <ion-item>
      <ion-input
        formControlName="mansione"
        label="Mansione (opzionale)"
        labelPlacement="stacked"
        placeholder="Responsabile, Tecnico, Organizzatore..."
        errorText="Massimo 100 caratteri"
        maxlength="100"
      ></ion-input>
    </ion-item>

    <!-- Data Inizio -->
    <ion-item>
      <ion-input
        formControlName="dataInizio"
        label="Disponibile da"
        labelPlacement="stacked"
        type="date"
        [min]="today"
        errorText="La data non può essere nel passato"
        required
      ></ion-input>
    </ion-item>

    <!-- Data Fine -->
    <ion-item>
      <ion-input
        formControlName="dataFine"
        label="Disponibile fino a"
        labelPlacement="stacked"
        type="date"
        [min]="staffForm.get('dataInizio')?.value || today"
        errorText="La data di fine deve essere successiva o uguale alla data di inizio"
        required
      ></ion-input>
    </ion-item>

    <!-- Account Email -->
    <ion-item>
      <ion-input
        formControlName="accountEmail"
        label="Email Account Staff"
        labelPlacement="stacked"
        type="email"
        placeholder="staff@esempio.com"
        errorText="Inserisci un'email valida"
        required
      ></ion-input>
    </ion-item>

    <!-- Messaggio di errore generico -->
    @if (staffForm.invalid && staffForm.touched) {
      <ion-text color="danger" class="form-error">
        <p>Compila correttamente tutti i campi obbligatori.</p>
      </ion-text>
    }

    <!-- Pulsante Submit -->
    <ion-button
      type="submit"
      expand="block"
      [disabled]="staffForm.invalid"
    >
      Salva staff
    </ion-button>
  </form>
</ion-content>
