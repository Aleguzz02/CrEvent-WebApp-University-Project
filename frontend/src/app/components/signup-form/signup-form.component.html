<form [formGroup]="signupForm" (ngSubmit)="submitForm()">
  <ion-list>
    <ion-item>
      <ion-input formControlName="nome" label="Nome"labelPlacement="stacked" placeholder="Nome"
      errorText="Inserisci il tuo nome" required="true"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="cognome" label="Cognome" labelPlacement="stacked" placeholder="Cognome"
      errorText="Inserisci il tuo cognome" required="true"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="dataNascita" label="Data di Nascita" type="date"
      errorText="Data non valida" required="true"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="email" label="Email" type="email" placeholder="email@domain.com"
      errorText="Email non valida" required="true"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="telefono" label="Telefono" type="tel" placeholder="123 4567890"
      errorText="Telefono non valido" required="true"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="password" label="Password" type="password"
      errorText="Password non valida. Almeno 8 caratteri, una lettera e
      un numero" required="true"></ion-input>
    </ion-item>
  </ion-list>
</form>
