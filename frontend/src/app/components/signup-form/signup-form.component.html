<form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
  <ion-list>
    <ion-item>
      <ion-input formControlName="nome" label="Nome"labelPlacement="stacked" placeholder="Nome"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="cognome" label="Cognome" labelPlacement="stacked" placeholder="Cognome"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="dataNascita" label="Data di Nascita" type="date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="email" label="Email" type="email" placeholder="email@domain.com" errorText="Email non valida"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="telefono" label="Telefono" type="tel" placeholder="123 4567890"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="password" label="Password" type="password"></ion-input>
    </ion-item>
  </ion-list>
</form>
