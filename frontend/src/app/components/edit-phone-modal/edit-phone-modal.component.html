<ion-header>
  <ion-toolbar mode="ios" class="toolbar-grande">
    <ion-buttons slot="start">
      <div class="contenitore-annulla annulla-uniforme">
        <ion-button class="bottone-annulla" fill="clear" (click)="dismiss()">
          Annulla
        </ion-button>
      </div>
    </ion-buttons>

    <ion-title>Modifica telefono</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="profile-modal-content">
    <ion-item class="profile-input-item">
      <ion-label position="stacked">Numero di telefono</ion-label>
      <ion-input
        [(ngModel)]="phone"
        type="tel"
        maxlength="10"
        inputmode="numeric"
        placeholder="Es. 3331234567"
        (ionInput)="formatPhone($event)">
      </ion-input>
    </ion-item>

    @if (submitted && !validPhone) {
      <ion-text color="danger" class="errore-input">
        Il telefono deve contenere esattamente 10 cifre.
      </ion-text>
    }

    <ion-note class="profile-modal-note">
      Inserisci solo cifre, senza spazi o prefisso internazionale.
    </ion-note>

    <ion-button
      class="bottone-salva-profilo"
      expand="block"
      (click)="save()"
      [disabled]="!validPhone">
      Salva
    </ion-button>
  </div>
</ion-content>
