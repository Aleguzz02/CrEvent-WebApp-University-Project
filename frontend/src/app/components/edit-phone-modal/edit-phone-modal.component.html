<ion-header>
  <ion-toolbar>
    <ion-title>Modifica telefono</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Annulla</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Numero di telefono</ion-label>
    <ion-input
      [(ngModel)]="phone"
      type="tel"
      maxlength="10"
      inputmode="numeric"
    ></ion-input>
  </ion-item>
  <p class="ion-text-muted ion-padding-start">
    <ion-note>Inserisci il nuovo numero di telefono</ion-note>
  </p>

  <ion-button expand="block" (click)="save()" [disabled]="!phone || phone.length < 10">
    Salva
  </ion-button>
</ion-content>
