<ion-header>
  <ion-toolbar>
    <ion-title>Cambia password</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Annulla</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Password attuale</ion-label>
    <ion-input
      [(ngModel)]="currentPassword"
      type="password"
      placeholder="Inserisci la password attuale"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Nuova password</ion-label>
    <ion-input
      [(ngModel)]="newPassword"
      type="password"
      placeholder="Min 8 caratteri, 1 maiuscola, 1 minuscola, 1 numero"
    ></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Conferma nuova password</ion-label>
    <ion-input
      [(ngModel)]="confirmPassword"
      type="password"
      placeholder="Ripeti la nuova password"
    ></ion-input>
  </ion-item>

  <p class="ion-text-muted ion-padding-start">
    <ion-note>Minimo 8 caratteri, almeno 1 maiuscola, 1 minuscola e 1 numero</ion-note>
  </p>

  <ion-button
    expand="block"
    (click)="save()"
    [disabled]="!currentPassword || !newPassword || !confirmPassword"
  >
    Salva
  </ion-button>
</ion-content>
