<ion-card
  class="location-card"
  [class.location-selezionata]="selezionata"
  [button]="true"
  (click)="selezionaLocation()">

  <ion-img [src]="immagineLocation" alt="Immagine location"></ion-img>

  <ion-card-content>
    <div class="card-header">
      <div>
        <h2>{{ location?.nome }}</h2>

        @if (location?.citta || location?.indirizzo) {
          <ion-text color="medium">
            <p>{{ location?.citta }} {{ location?.indirizzo }}</p>
          </ion-text>
        }
      </div>

      @if (selezionata) {
        <ion-icon name="checkmark-circle" color="primary"></ion-icon>
      }
    </div>

    <div class="card-info">
      <div>
        <ion-icon name="people-outline"></ion-icon>
        <span>{{ location?.capienza }} persone</span>
      </div>

      <div>
        <ion-icon name="cash-outline" color="cash"></ion-icon>
        <span>{{ location?.costo }} euro</span>
      </div>
    </div>
  </ion-card-content>

</ion-card>
