<ion-header>
  <ion-toolbar mode="ios" class="toolbar-grande">
    <ion-buttons slot="start">
      <div class="contenitore-annulla annulla-uniforme">
        <ion-button class="bottone-annulla" fill="clear" (click)="loginFormRef.resetForm(); closeLoginModal()">
          Annulla
        </ion-button>
      </div>
    </ion-buttons>
    <ion-title>Accedi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding auth-content">
  <div class="auth-modal-content">
    <app-login-form #loginFormRef (formSubmit)="handleFormSubmit($event)"></app-login-form>

    <div class="forgot-password-container ion-text-center">
      <ion-button class="forgot-password-button" fill="clear" color="medium" size="small" (click)="openForgotPasswordModal()">
        Hai dimenticato la password?
      </ion-button>
    </div>

    <ion-button class="bottone-conferma-auth" expand="block" (click)="loginFormRef.submitForm()" [strong]="true">
      Conferma
    </ion-button>

    <div class="auth-switch-section">
      <ion-text color="medium" class="auth-switch-label">
        Non hai un account?
      </ion-text>
      <ion-button class="auth-switch-button" expand="block" fill="clear" color="primary" (click)="openSignupModal()">
        Registrati
      </ion-button>
    </div>
  </div>
</ion-content>
