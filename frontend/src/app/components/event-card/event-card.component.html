<ion-card class="evento-card" [class.evento-in-programma]="evento?.svolto !== 1">
  <div class="card-layout">
    <div class="card-info">
      <ion-card-header>
        <ion-card-title class="titolo-evento">{{ evento?.nome }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <div class="dettagli-riga">
          <p><strong>Data:</strong> {{ formattedDate }}</p>
          <p><strong>Invitati:</strong> {{ evento?.invitati }}</p>
        </div>

        <div class="stato-evento">
          <ion-badge [color]="evento?.svolto === 1 ? 'medium' : 'success'">
            {{ evento?.svolto === 1 ? 'Concluso' : 'In Programma' }}
          </ion-badge>
        </div>

        <ion-button class="bottone-info" fill="clear" size="small" (click)="apriDettagli()">
          Gestisci / Info
        </ion-button>
      </ion-card-content>
    </div>

    <div class="card-immagine">
      <img [src]="locationImage" alt="Foto della location" />
    </div>
  </div>
</ion-card>
