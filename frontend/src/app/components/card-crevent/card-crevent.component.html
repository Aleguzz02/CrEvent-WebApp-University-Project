<ion-card class="crevent-card">
  <img [src]="locationImage" alt="Immagine Risorsa" />
  
  <ion-card-header>
    <ion-card-title>
      {{ resourceData?.nome }} {{ resourceData?.cognome ? resourceData.cognome : '' }}
    </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    @for(detail of specificDetail; track detail.label){
      <p><strong>{{ detail.label }} </strong>{{ detail.valore }}</p>
    }
    <div class="card-footer">

      <span class="prezzo">
        <strong>{{ priceText }}</strong>
      </span>
      
      <ion-button fill="clear" color="primary" (click)="openDetail()">Info</ion-button>
    </div>
  </ion-card-content>
</ion-card>
