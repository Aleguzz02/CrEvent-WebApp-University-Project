<ion-header [translucent]="true">
  <ion-toolbar mode="ios" class="toolbar-grande">
    <ion-title>
      CrEvent
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar mode="ios" class="toolbar-grande" transparent>
      <ion-title size="large">CrEvent</ion-title>
    </ion-toolbar>
  </ion-header>

  @if(sezione !== 'iniziale'){
  <ion-toolbar mode="ios" class="toolbar-sottile">
    <ion-segment [value]="sezione" (ionChange)="selezionaSezione($any($event).detail.value)">
      <ion-segment-button value="location">
        <ion-label>Location</ion-label>
      </ion-segment-button>
      <ion-segment-button value="staff">
        <ion-label>Staff</ion-label>
      </ion-segment-button>
    </ion-segment>
  </ion-toolbar>
  }
  <ion-content>
    @if (sezione === 'iniziale') {
    <div class="contenitore-iniziale">
      <ion-card class="bottone-grande location-bg" (click)="selezionaSezione('location')">
        <div class="overlay-scuro">
          <ion-card-header>
            <ion-card-title>Location</ion-card-title>
          </ion-card-header>
        </div>
      </ion-card>

      <ion-card class="bottone-grande staff-bg" (click)="selezionaSezione('staff')">
        <div class="overlay-scuro">
          <ion-card-header>
            <ion-card-title>Staff</ion-card-title>
          </ion-card-header>
        </div>
      </ion-card>
    </div>
    }
  </ion-content>

</ion-content>
