<ion-list>
    <ion-item>
      <ion-input label="First Name" placeholder="First Name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Surname" placeholder="Surname"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Date of birth" type="date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Email" type="email" placeholder="email@domain.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Telephone input" type="tel" placeholder="123 4567890"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Password" type="password" value="password"></ion-input>
    </ion-item>
  </ion-list>
