<form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
  <ion-list>
    <ion-item>
      <ion-input formControlName="nome" label="First Name" labelPlacement="stacked" placeholder="First Name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="cognome" label="Surname" labelPlacement="stacked" placeholder="Surname"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="dataNascita" label="Date of birth" type="date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="email" label="Email" type="email" placeholder="email@domain.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="telefono" label="Telephone" type="tel" placeholder="123 4567890"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input formControlName="password" label="Password" type="password"></ion-input>
    </ion-item>
  </ion-list>
</form>
