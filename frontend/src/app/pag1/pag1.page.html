<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CrEvent</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sign Up</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button id="open-modal" expand="block">Sign Up</ion-button>
  <ion-modal trigger="open-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button>Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome</ion-title>
          <ion-buttons slot="end">
            <ion-button>Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-list>
  <ion-list>
    <ion-item>
      <ion-input label="First Name" placeholder="First Name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Surname" placeholder="Surname"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Date of birth" type="date"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Email input" type="email" placeholder="email@domain.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Telephone input" type="tel" placeholder="123 4567890"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Password" type="password" value="password"></ion-input>
    </ion-item>
  </ion-list>
</ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
