<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CrEvent</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sign Up</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button id="loginbutton" expand="block">Log In</ion-button>
<ion-modal trigger="loginbutton">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome back!</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-list>
  <ion-list>
    <ion-item>
      <ion-input label="Email" type="email" placeholder="email@domain.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Password" type="password" value="password"></ion-input>
    </ion-item>
  </ion-list>
</ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>


  <ion-button id="signupbutton" expand="block">Sign Up</ion-button>
  <ion-modal trigger="signupbutton">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="cancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="confirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <ion-list>
  <app-signup-form></app-signup-form>
</ion-list>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
