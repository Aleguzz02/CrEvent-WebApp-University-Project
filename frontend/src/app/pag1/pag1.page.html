<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>CrEvent</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Sign Up</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button id="loginbutton" expand="block">Log In</ion-button>
  <ion-modal #loginModal trigger="loginbutton">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="loginCancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome back!</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="loginConfirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <app-login-form></app-login-form>
      </ion-content>
    </ng-template>
  </ion-modal>


  <ion-button id="signupbutton" expand="block">Sign Up</ion-button>
  <ion-modal #signupModal trigger="signupbutton">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="signupCancel()">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Welcome</ion-title>
          <ion-buttons slot="end">
            <ion-button (click)="signupConfirm()" [strong]="true">Confirm</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <app-signup-form></app-signup-form>
      </ion-content>
    </ng-template>
  </ion-modal>

</ion-content>
