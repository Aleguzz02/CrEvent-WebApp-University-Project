<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      @if (isAdmin$ | async) {
        <ion-icon aria-hidden="true" name="people"></ion-icon>
        <ion-label>Utenti &amp; Eventi</ion-label>
      } @else {
        <ion-icon aria-hidden="true" name="calendar"></ion-icon>
        <ion-label>Eventi</ion-label>
      }
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      @if (isAdmin$ | async) {
        <ion-icon aria-hidden="true" name="business"></ion-icon>
        <ion-label>Location &amp; Staff</ion-label>
      } @else {
        <ion-icon aria-hidden="true" name="search"></ion-icon>
        <ion-label>Browse</ion-label>
      }
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="person"></ion-icon>
      <ion-label>Profilo</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
